<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingua Viva — Language Immersion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0e0e10;
      color: #e2e2e2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Welcome screen ── */
    #welcome-screen {
      position: fixed;
      inset: 0;
      background: #0e0e10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      z-index: 100;
      text-align: center;
      padding: 2rem;
    }

    #greeting-text {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #6b7df5;
      opacity: 1;
      transition: opacity 0.45s ease;
      min-height: 5rem;
      width: 100%;
      text-align: center;
    }

    #welcome-brand h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
    }

    #welcome-brand h1 span { color: #6b7df5; }

    #welcome-brand p {
      font-size: 0.9rem;
      color: #555;
    }

    #welcome-screen .btn-primary {
      max-width: 200px;
      margin-top: 0.5rem;
    }

    #key-entry {
      width: 100%;
      max-width: 300px;
      display: none;
    }

    #key-entry input {
      width: 100%;
      padding: 0.7rem 1rem;
      background: #18181c;
      border: 1px solid #2e2e36;
      border-radius: 8px;
      color: #e2e2e2;
      font-size: 0.9rem;
      text-align: center;
      outline: none;
      transition: border-color 0.15s;
    }

    #key-entry input:focus { border-color: #6b7df5; }

    #key-entry p {
      font-size: 0.75rem;
      color: #3a3a4a;
      margin-top: 0.4rem;
    }

    #key-entry .key-error {
      color: #f87171;
      font-size: 0.78rem;
      margin-top: 0.35rem;
      display: none;
    }

    #key-entry .key-error.show { display: block; }

    /* ── Language ticker ── */
    #lang-ticker-wrap {
      display: inline-block;
      overflow: hidden;
      height: 1.2em;
      vertical-align: bottom;
      line-height: 1.2;
    }

    #lang-ticker-inner {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      animation: lang-scroll 7.5s linear infinite;
    }

    #lang-ticker-inner span {
      display: block;
      height: 1.2em;
      color: #6b7df5;
    }

    @keyframes lang-scroll {
      0%      { transform: translateY(0); }
      26%     { transform: translateY(0); }
      33.33%  { transform: translateY(-1.2em); }
      59.33%  { transform: translateY(-1.2em); }
      66.66%  { transform: translateY(-2.4em); }
      92.66%  { transform: translateY(-2.4em); }
      100%    { transform: translateY(-3.6em); }
    }

    /* ── Language selector pills ── */
    #lang-selector {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 4px;
    }

    .lang-pill {
      background: transparent;
      border: 1px solid #2e2e36;
      color: #555;
      font-size: 0.82rem;
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 500;
    }

    .lang-pill:hover { border-color: #444; color: #888; }

    .lang-pill.active {
      border-color: #6b7df5;
      color: #6b7df5;
    }

    /* ── Shared buttons ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.7rem 1.4rem;
      transition: opacity 0.15s, background 0.15s;
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: #6b7df5;
      color: #fff;
      width: 100%;
    }

    .btn-primary:not(:disabled):hover { background: #5769e8; }

    /* ── Error msg ── */
    .error {
      background: #1f1218;
      border: 1px solid #5c2030;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.82rem;
      color: #f87171;
      text-align: left;
      margin-bottom: 0.75rem;
      display: none;
    }

    .error.show { display: block; }

    /* ── Main screen ── */
    #main {
      display: none;
      width: 100%;
      max-width: 600px;
      padding: 1.25rem;
      flex-direction: column;
      gap: 0.9rem;
    }

    #main.show { display: flex; }

    /* ── Camera ── */
    #cam-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      aspect-ratio: 4/3;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #status-pill {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 0.72rem;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.03em;
    }

    #status-pill.active   { color: #4ade80; }
    #status-pill.thinking { color: #fbbf24; }
    #status-pill.speaking { color: #818cf8; }
    #status-pill.error    { color: #f87171; }

    /* [NEW] Review badge — sits top-left of the camera */
    #review-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 500;
      color: #fbbf24;
      letter-spacing: 0.03em;
      display: none;
    }

    #review-badge.show { display: block; }

    /* ── Flip camera button ── */
    #flip-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 1.1rem;
      color: #6b7df5;
      display: none;
      border: 1px solid rgba(107,125,245,0.3);
    }

    #flip-btn.show { display: block; }
    #flip-btn:hover { background: rgba(107,125,245,0.15); }

    /* ── Toggle button ── */
    #toggle-btn {
      background: #6b7df5;
      color: #fff;
      font-size: 1rem;
      padding: 0.75rem;
    }

    #toggle-btn:hover:not(:disabled) { background: #5769e8; }
    #toggle-btn.running { background: #dc2626; }
    #toggle-btn.running:hover:not(:disabled) { background: #b91c1c; }

    /* ── Narration box ── */
    #narration-box {
      position: relative; /* [NEW] needed for level pill */
      background: #16161a;
      border: 1px solid #25252d;
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
    }

    /* [NEW] CEFR level pill — top-right inside narration box */
    #level-pill {
      position: absolute;
      top: 0.85rem;
      right: 0.9rem;
      background: rgba(107, 125, 245, 0.1);
      border: 1px solid rgba(107, 125, 245, 0.22);
      border-radius: 6px;
      padding: 1px 7px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #6b7df5;
      letter-spacing: 0.06em;
      display: none;
    }

    #level-pill.show { display: block; }

    #narration-italian {
      font-size: 1.2rem;
      line-height: 1.65;
      margin-bottom: 0.5rem;
      min-height: 1.8rem;
      padding-right: 2.8rem; /* [NEW] leave room for level pill */
    }

    #narration-italian.placeholder { color: #3a3a46; font-style: italic; font-size: 0.95rem; }

    /* [NEW] Focus word highlight — muted purple, matches #6b7df5 accent */
    mark {
      background: rgba(107, 125, 245, 0.18);
      color: #a8b4f8;
      border-radius: 3px;
      padding: 0 3px;
      font-style: normal;
    }

    #narration-english {
      font-size: 0.88rem;
      color: #7a7a8a;
      line-height: 1.5;
      display: none;
      margin-bottom: 0.7rem;
    }

    #narration-english.show { display: block; }

    #trans-toggle {
      background: transparent;
      border: 1px solid #2e2e36;
      color: #666;
      font-size: 0.78rem;
      padding: 3px 10px;
    }

    #trans-toggle:hover { border-color: #444; color: #999; }

    /* ── Speak-back box ── */
    #speak-back {
      background: #16161a;
      border: 1px solid #25252d;
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      display: none;
    }

    #speak-back.show { display: block; }

    #speak-label {
      font-size: 0.72rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.6rem;
    }

    #speak-phrase {
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 0.9rem;
    }

    #speak-btn {
      background: #1e1e26;
      border: 1px solid #35353f;
      color: #ccc;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.88rem;
      padding: 0.55rem 1rem;
    }

    #speak-btn:hover:not(:disabled) { background: #26262f; border-color: #4a4a58; }
    #speak-btn.listening { border-color: #ef4444; color: #ef4444; }

    #hear-again-btn {
      background: transparent;
      border: 1px solid #2e2e36;
      color: #666;
      font-size: 0.78rem;
      padding: 3px 10px;
      margin-left: 0.4rem;
    }
    #hear-again-btn:hover:not(:disabled) { border-color: #444; color: #999; }
    #hear-again-btn:disabled { opacity: 0.3; cursor: default; }

    #feedback-row {
      margin-top: 0.75rem;
      display: none;
    }

    #feedback-row.show { display: block; }

    #feedback-label {
      font-size: 0.95rem;
      font-weight: 600;
    }

    #feedback-label.exact  { color: #4ade80; }
    #feedback-label.close  { color: #fbbf24; }
    #feedback-label.off    { color: #f87171; }

    #feedback-heard {
      font-size: 0.8rem;
      color: #555;
      margin-top: 0.25rem;
    }

    /* [NEW] Coaching tip — italic, muted, below feedback */
    #coaching-tip {
      font-size: 0.82rem;
      color: #6a6a7a;
      font-style: italic;
      margin-top: 0.3rem;
      display: none;
    }

    /* ── Main error ── */
    #main-error { margin-top: 0; }
  </style>
</head>
<body>

<!-- ── Welcome ── -->
<div id="welcome-screen">
  <div id="greeting-text">hello</div>
  <div id="welcome-brand">
    <h1>Lingua <span>Viva</span></h1>
    <p>Learn <span id="lang-ticker-wrap"><span id="lang-ticker-inner"><span>Italian</span><span>Spanish</span><span>French</span><span>Italian</span></span></span> through your world.</p>
  </div>
  <div id="key-entry">
    <input type="password" id="key-input" placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false" />
    <p>Saved to this browser — you won't be asked again.</p>
    <p class="key-error" id="key-error">Please enter a valid API key.</p>
  </div>
  <div id="lang-selector">
    <button class="lang-pill active" data-lang="italian">Italian</button>
    <button class="lang-pill" data-lang="spanish">Spanish</button>
    <button class="lang-pill" data-lang="french">French</button>
  </div>
  <button class="btn-primary" id="start-btn">Start</button>
</div>

<!-- ── Main ── -->
<div id="main">
  <div id="cam-wrap">
    <video id="camera" autoplay playsinline muted></video>
    <div id="status-pill">Ready</div>
    <!-- [NEW] Review badge -->
    <div id="review-badge">🔁 Review</div>
    <button id="flip-btn" title="Flip camera">⇄</button>
  </div>

  <button id="toggle-btn">Start</button>

  <div id="narration-box">
    <!-- [NEW] CEFR level pill -->
    <div id="level-pill"></div>
    <p id="narration-italian" class="placeholder">Narration will appear here…</p>
    <p id="narration-english"></p>
    <button id="trans-toggle">Show translation</button>
    <button id="hear-again-btn" disabled>🔊 Hear again</button>
  </div>

  <div id="speak-back">
    <div id="speak-label">Repeat after me</div>
    <p id="speak-phrase"></p>
    <button id="speak-btn">🎤 Tap to speak</button>
    <div id="feedback-row">
      <div id="feedback-label"></div>
      <div id="feedback-heard"></div>
      <!-- [NEW] Claude coaching tip -->
      <div id="coaching-tip"></div>
    </div>
  </div>

  <div class="error" id="main-error"></div>
</div>

<script type="module">
import Anthropic from 'https://esm.sh/@anthropic-ai/sdk@0.52.0';


// ── Elements ──────────────────────────────────────────────────────────────────
const welcomeScreenEl = document.getElementById('welcome-screen');
const mainEl          = document.getElementById('main');
const mainError       = document.getElementById('main-error');

const cameraEl      = document.getElementById('camera');
const statusPill    = document.getElementById('status-pill');
const toggleBtn     = document.getElementById('toggle-btn');
const flipBtn       = document.getElementById('flip-btn');
const reviewBadgeEl = document.getElementById('review-badge');

const narrationItalian = document.getElementById('narration-italian');
const narrationEnglish = document.getElementById('narration-english');
const transToggle      = document.getElementById('trans-toggle');
const levelPill        = document.getElementById('level-pill');  // [NEW]

const hearAgainBtn  = document.getElementById('hear-again-btn');
const speakBackEl   = document.getElementById('speak-back');
const speakPhrase   = document.getElementById('speak-phrase');
const speakBtn      = document.getElementById('speak-btn');
const feedbackRow   = document.getElementById('feedback-row');
const feedbackLabel = document.getElementById('feedback-label');
const feedbackHeard = document.getElementById('feedback-heard');
const coachingTip   = document.getElementById('coaching-tip');  // [NEW]

// ── Language config ───────────────────────────────────────────────────────────
const LANGUAGES = {
  italian: { name: 'Italian', locale: 'it-IT', langStart: 'it' },
  spanish: { name: 'Spanish', locale: 'es-ES', langStart: 'es' },
  french:  { name: 'French',  locale: 'fr-FR', langStart: 'fr' },
};
let selectedLanguage = 'italian';

// ── State ─────────────────────────────────────────────────────────────────────
let client          = null;
let isRunning       = false;
let loopRunning     = false;
let showTranslation = false;
let targetVoice     = null;
let facingMode      = 'user';  // 'user' (front) or 'environment' (rear)

// Session state — all reset on Stop
let vocabSeen      = new Map(); // normalized word → cycle number first seen
let vocabOriginals = new Map(); // normalized word → original Italian word (for prompts)
let cycleCount     = 0;
let performanceScore = 0.15;   // start firmly in A1 tier (< 0.35)
let currentFocusWord = null;   // set during displayNarration, consumed at end of loop
let currentNarration = '';     // last narration text, used by Hear Again button
let onHearAgain      = null;   // callback set by speakBackPhase to reset its auto-skip timer

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStatus(cls, text) {
  statusPill.className = cls;
  statusPill.textContent = text;
}

function showError(el, msg) { el.textContent = msg; el.classList.add('show'); }
function hideError(el) { el.classList.remove('show'); }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// Strip diacritics + lowercase + keep only letters — used as Map key
function normalizeWord(w) {
  return w.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z]/g, '');
}

// Safe HTML escape before using innerHTML
function escapeHTML(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ── [NEW] Dynamic prompt builder ──────────────────────────────────────────────
function buildPrompt() {
  // 20 most recently seen focus words (highest cycle numbers first)
  const recentEntries = [...vocabSeen.entries()].sort((a, b) => b[1] - a[1]).slice(0, 20);
  const avoidWords = recentEntries.map(([norm]) => vocabOriginals.get(norm) || norm);

  // Review: every 5 cycles, surface the oldest seen word
  const isReview = cycleCount > 0 && cycleCount % 5 === 0 && vocabSeen.size > 0;
  let reviewWord = null;
  if (isReview) {
    const oldest = [...vocabSeen.entries()].sort((a, b) => a[1] - b[1])[0];
    if (oldest) reviewWord = vocabOriginals.get(oldest[0]) || oldest[0];
  }

  // Difficulty tier from performanceScore (5 gradual steps)
  let difficulty;
  if (performanceScore < 0.20) {
    difficulty = 'A1 strict: one sentence, present tense only, maximum 7 words, only the most common everyday nouns and verbs.';
  } else if (performanceScore < 0.38) {
    difficulty = 'A1: one sentence, present tense, up to 10 words, common vocabulary, one simple adjective allowed.';
  } else if (performanceScore < 0.55) {
    difficulty = 'A1-A2: one or two short sentences, present tense, up to 13 words, common adjectives and descriptions.';
  } else if (performanceScore < 0.73) {
    difficulty = 'A2: two short sentences, adjectives, present and near-future tense, up to 17 words.';
  } else {
    difficulty = 'B1: compound sentences, past tense occasionally, richer descriptive vocabulary, up to 23 words.';
  }

  const avoidLine  = avoidWords.length > 0 ? `Avoid these already-seen words: ${avoidWords.join(', ')}.` : '';
  const reviewLine = reviewWord ? `Review moment: naturally work the word "${reviewWord}" into the narration as a callback to something the learner has seen before.` : '';

  const langName = LANGUAGES[selectedLanguage].name;
  const prompt = `You are a ${langName} language tutor creating an immersion experience.
Look at this image. Identify the single most visually prominent object or action that is NOT already in the avoid list. Build a short, natural ${langName} narration centered on that one focus item.

Difficulty: ${difficulty}
${avoidLine}
${reviewLine}

Return ONLY valid JSON with no markdown or code fences:
{"narration": "...", "english": "...", "focusWord": "the key ${langName} word the narration centres on", "level": "A1|A2|B1"}`;

  return { prompt, isReview: isReview && reviewWord !== null };
}

// ── Voices ────────────────────────────────────────────────────────────────────
function loadVoices() {
  return new Promise(resolve => {
    const pick = () => {
      const voices = speechSynthesis.getVoices();
      const lang = LANGUAGES[selectedLanguage];
      targetVoice = voices.find(v => v.lang === lang.locale && v.localService)
                 || voices.find(v => v.lang.startsWith(lang.langStart))
                 || null;
      resolve();
    };
    if (speechSynthesis.getVoices().length > 0) { pick(); return; }
    speechSynthesis.addEventListener('voiceschanged', pick, { once: true });
    setTimeout(pick, 1500);
  });
}

// ── Camera ────────────────────────────────────────────────────────────────────
async function startCamera() {
  const videoConstraints = { facingMode };
  const constraints = hasSR
    ? { video: videoConstraints, audio: true }
    : { video: videoConstraints, audio: false };
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  stream.getAudioTracks().forEach(t => t.stop());
  cameraEl.srcObject = stream;
  cameraEl.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'none';
  await new Promise(r => cameraEl.addEventListener('loadedmetadata', r, { once: true }));
}

async function flipCamera() {
  if (cameraEl.srcObject) cameraEl.srcObject.getTracks().forEach(t => t.stop());
  const prev = facingMode;
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  try {
    await startCamera();
  } catch {
    facingMode = prev;
    await startCamera();
  }
}

async function primeMicPermission() {
  // Permission already primed inside startCamera — nothing to do here.
}

function captureFrame() {
  const w = cameraEl.videoWidth  || 640;
  const h = cameraEl.videoHeight || 480;
  const canvas = document.createElement('canvas');
  canvas.width  = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  if (facingMode === 'user') {
    // Un-mirror front camera before sending to Claude
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(cameraEl, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', 0.75).split(',')[1];
}

// ── Claude API — narration ────────────────────────────────────────────────────
async function getNarration(base64Image) {
  const { prompt, isReview } = buildPrompt();
  reviewBadgeEl.classList.toggle('show', isReview);

  const msg = await client.messages.create({
    model: 'claude-sonnet-4-6',
    max_tokens: 200,
    messages: [{
      role: 'user',
      content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64Image } },
        { type: 'text', text: prompt }
      ]
    }]
  });

  const raw = msg.content[0].text.trim()
    .replace(/^```(?:json)?\n?/, '')
    .replace(/\n?```$/, '')
    .trim();

  return JSON.parse(raw);
}

// ── [NEW] Claude API — pronunciation coaching (no image, lightweight) ─────────
async function getCoachingTip(targetPhrase, heardTranscript) {
  try {
    const msg = await client.messages.create({
      model: 'claude-sonnet-4-6',
      max_tokens: 80,
      messages: [{
        role: 'user',
        content: `The learner was asked to say: '${targetPhrase}'. They said: '${heardTranscript}'. Return only valid JSON — the tip MUST be written in English regardless of the phrase language: {"score": "exact|close|off", "tip": "one short encouraging coaching tip in English under 10 words"}`
      }]
    });

    const raw = msg.content[0].text.trim()
      .replace(/^```(?:json)?\n?/, '')
      .replace(/\n?```$/, '')
      .trim();

    const parsed = JSON.parse(raw);
    // Validate score field to avoid bad data poisoning state
    if (!['exact', 'close', 'off'].includes(parsed.score)) return null;
    return parsed;
  } catch {
    return null; // degrade gracefully — caller falls back to compareSpoken
  }
}

// ── Speech synthesis ──────────────────────────────────────────────────────────
function speak(text) {
  return new Promise(resolve => {
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang  = LANGUAGES[selectedLanguage].locale;
    utt.rate  = 0.82;
    utt.pitch = 1;
    if (targetVoice) utt.voice = targetVoice;
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    utt.onend   = finish;
    utt.onerror = finish;
    speechSynthesis.speak(utt);
    // iOS: onend sometimes never fires — resolve after generous timeout so the loop isn't stuck
    setTimeout(finish, 10000);
  });
}

// ── Audio feedback sounds ─────────────────────────────────────────────────────
function playFeedbackSound(result) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    if (result === 'exact') {
      // Ascending two-note chime: C5 → E5
      [523.25, 659.25].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.18);
        gain.gain.setValueAtTime(0, now + i * 0.18);
        gain.gain.linearRampToValueAtTime(0.25, now + i * 0.18 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.35);
        osc.start(now + i * 0.18);
        osc.stop(now + i * 0.18 + 0.4);
      });
    } else if (result === 'close') {
      // Single mid tone: A4
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now); osc.stop(now + 0.4);
    } else {
      // Gentle descending: D4 → A3
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(293.66, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.3);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now); osc.stop(now + 0.5);
    }
  } catch { /* degrade gracefully */ }
}

// ── Speech recognition ────────────────────────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const hasSR = Boolean(SR);

function listenOnce(locale) {
  return new Promise(resolve => {
    if (!hasSR) { resolve(null); return; }
    const rec = new SR();
    rec.lang = locale;
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    let resolved = false;
    let pendingError = null;
    // Capture error before resolving — Chrome sometimes fires onend before onerror
    const done = v => {
      if (!resolved) {
        resolved = true;
        if (pendingError) lastSRError = pendingError;
        resolve(v);
      }
    };
    // Stop immediately on result so iOS doesn't hang waiting for silence detection
    rec.onresult = e => { const t = Array.from(e.results[0]).map(r => r.transcript)[0] || null; try { rec.stop(); } catch {} done(t); };
    rec.onerror  = e => { pendingError = e.error; lastSRError = e.error; done(null); };
    rec.onend    = () => done(null);
    // Hard 8s timeout in case iOS never fires onresult or onend
    const timeout = setTimeout(() => { try { rec.stop(); } catch {} done(null); }, 8000);
    const cleanup = () => clearTimeout(timeout);
    rec.addEventListener('end', cleanup, { once: true });
    try { rec.start(); } catch { cleanup(); done(null); }
  });
}
let lastSRError = null;

// Try the full locale first; if it returns nothing silently, retry with base language code
async function listenWithFallback() {
  const lang = LANGUAGES[selectedLanguage];
  lastSRError = null;
  let heard = await listenOnce(lang.locale);
  // 'aborted' = Chrome busy right after prior session; silent null = model not loaded
  // In both cases, retry with base language code after a short pause
  if (heard === null && (!lastSRError || lastSRError === 'aborted')) {
    await delay(300);
    lastSRError = null;
    heard = await listenOnce(lang.langStart);
  }
  return heard;
}

// ── Text comparison (fallback) ────────────────────────────────────────────────
function compareSpoken(target, spoken) {
  if (!spoken) return 'off';
  const norm = s => s.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z\s]/g, '')
    .trim();
  const t = norm(target);
  const s = norm(spoken);
  if (t === s) return 'exact';
  const tWords = t.split(/\s+/).filter(Boolean);
  const sSet   = new Set(s.split(/\s+/).filter(Boolean));
  const hits   = tWords.filter(w => sSet.has(w)).length;
  return hits / tWords.length >= 0.65 ? 'close' : 'off';
}

// ── [NEW] Display narration with focus-word highlight & level pill ────────────
function displayNarration(narration) {
  narrationItalian.classList.remove('placeholder');

  const focusWord = narration.focusWord || null;
  currentFocusWord = focusWord;

  if (focusWord) {
    // Escape the raw text, then wrap the focus word with <mark>
    const safeText  = escapeHTML(narration.narration);
    const safeFocus = escapeHTML(focusWord).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const highlighted = safeText.replace(
      new RegExp(`(${safeFocus})`, 'gi'),
      '<mark>$1</mark>'
    );
    narrationItalian.innerHTML = highlighted;
  } else {
    narrationItalian.textContent = narration.narration;
  }

  narrationEnglish.textContent = narration.english || '';

  // CEFR level pill
  if (narration.level && ['A1', 'A2', 'B1'].includes(narration.level)) {
    levelPill.textContent = narration.level;
    levelPill.classList.add('show');
  }
}

// ── Speak-back phase ──────────────────────────────────────────────────────────
async function speakBackPhase(phrase) {
  speakPhrase.textContent = phrase;
  feedbackRow.classList.remove('show');
  feedbackLabel.className = '';
  feedbackLabel.textContent = '';
  feedbackHeard.textContent = '';
  coachingTip.textContent = '';      // [NEW] reset tip
  coachingTip.style.display = 'none';
  speakBtn.disabled = false;
  speakBtn.className = '';
  speakBtn.textContent = '🎤 Tap to speak';
  speakBackEl.classList.add('show');

  if (!hasSR) {
    await delay(8000);
    speakBackEl.classList.remove('show');
    return;
  }

  await new Promise(resolve => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(autoSkip);
      onHearAgain = null;
      speakBtn.onclick = null;
      speakBackEl.classList.remove('show');
      resolve();
    };

    let autoSkip = setTimeout(finish, 11000);
    onHearAgain = () => {
      clearTimeout(autoSkip);
      autoSkip = setTimeout(finish, 11000);
    };

    speakBtn.onclick = async () => {
      if (done) return;
      clearTimeout(autoSkip);
      speakBtn.disabled = true;
      speakBtn.classList.add('listening');
      speakBtn.textContent = '🔴 Listening…';
      speechSynthesis.cancel();

      const heard = await listenWithFallback();

      if (!isRunning) { finish(); return; }

      // [NEW] Score: try Claude coaching first, fall back to word-overlap
      let result, tip = null;
      if (heard !== null) {
        const coaching = await getCoachingTip(phrase, heard);
        if (coaching) {
          result = coaching.score;
          tip    = coaching.tip || null;
        } else {
          result = compareSpoken(phrase, heard);
        }
      } else {
        result = 'off';
      }

      // [NEW] Update adaptive performance score
      if      (result === 'exact') performanceScore = Math.min(1, performanceScore + 0.10);
      else if (result === 'close') performanceScore = Math.min(1, performanceScore + 0.03);
      else                         performanceScore = Math.max(0, performanceScore - 0.10);

      // Show feedback
      const messages = { exact: 'Perfect! ✓', close: 'Close enough ✓', off: 'Keep practicing' };
      feedbackLabel.className   = result;
      feedbackLabel.textContent = messages[result];
      playFeedbackSound(result);
      feedbackHeard.textContent = heard ? `Heard: "${heard}"` : (lastSRError ? `Error: ${lastSRError}` : 'Nothing detected');

      // [NEW] Show coaching tip if we got one
      if (tip) {
        coachingTip.textContent   = tip;
        coachingTip.style.display = 'block';
      }

      feedbackRow.classList.add('show');
      await delay(3500);
      finish();
    };
  });
}

// ── Core loop ─────────────────────────────────────────────────────────────────
async function runLoop() {
  loopRunning = true;
  while (isRunning) {
    cycleCount++;                        // [NEW] track cycle for review & vocabSeen
    setStatus('thinking', 'Analyzing…');

    let narration;
    try {
      narration = await getNarration(captureFrame());
    } catch (err) {
      console.error('API error:', err);
      cycleCount--;                      // don't count failed cycles
      showError(mainError, `API error: ${err.message || 'Unknown — check console'}`);
      setStatus('error', 'Error');
      await delay(6000);
      if (isRunning) hideError(mainError);
      continue;
    }

    if (!isRunning) break;
    hideError(mainError);

    displayNarration(narration);         // [NEW] handles highlight + level pill

    currentNarration = narration.narration;
    hearAgainBtn.disabled = false;
    setStatus('speaking', 'Speaking…');
    await speak(narration.narration);

    if (!isRunning) break;

    await speakBackPhase(narration.narration);

    if (!isRunning) break;

    // [NEW] Commit focus word to vocab memory after full cycle completes
    if (currentFocusWord) {
      const normalized = normalizeWord(currentFocusWord);
      if (normalized && !vocabSeen.has(normalized)) {
        vocabSeen.set(normalized, cycleCount);
        vocabOriginals.set(normalized, currentFocusWord);
      }
    }

    reviewBadgeEl.classList.remove('show');
    setStatus('active', 'Running');
    await delay(3000);
  }
  loopRunning = false;
}

// ── Controls ──────────────────────────────────────────────────────────────────
toggleBtn.addEventListener('click', () => {
  if (isRunning) {
    isRunning = false;
    speechSynthesis.cancel();
    speakBackEl.classList.remove('show');
    toggleBtn.textContent = 'Start';
    toggleBtn.classList.remove('running');
    setStatus('', 'Ready');
    // Reset all session state on Stop
    vocabSeen.clear();
    vocabOriginals.clear();
    cycleCount       = 0;
    performanceScore = 0.15;
    currentFocusWord = null;
    currentNarration = '';
    hearAgainBtn.disabled = true;
    reviewBadgeEl.classList.remove('show');
    levelPill.classList.remove('show');
  } else {
    isRunning = true;
    toggleBtn.textContent = 'Stop';
    toggleBtn.classList.add('running');
    hideError(mainError);
    // iOS requires speechSynthesis.speak() to be called directly within a user gesture
    // to unlock audio — do it here before the loop goes async
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    if (!loopRunning) runLoop();
  }
});

transToggle.addEventListener('click', () => {
  showTranslation = !showTranslation;
  narrationEnglish.classList.toggle('show', showTranslation);
  transToggle.textContent = showTranslation ? 'Hide translation' : 'Show translation';
});

hearAgainBtn.addEventListener('click', async () => {
  if (!currentNarration) return;
  if (onHearAgain) onHearAgain();
  hearAgainBtn.disabled = true;
  speakBtn.disabled = true;
  await speak(currentNarration);
  hearAgainBtn.disabled = false;
  speakBtn.disabled = false;
});

// ── Init + welcome screen ─────────────────────────────────────────────────────
// Resolve API key: magic-link hash → localStorage → manual entry
const hashKey = window.location.hash.slice(1);
if (hashKey.startsWith('sk-')) {
  localStorage.setItem('lv_key', hashKey);
  history.replaceState(null, '', window.location.pathname + window.location.search);
}
const savedKey = localStorage.getItem('lv_key');
if (savedKey) {
  client = new Anthropic({ apiKey: savedKey, dangerouslyAllowBrowser: true });
} else {
  document.getElementById('key-entry').style.display = 'block';
  document.getElementById('start-btn').textContent = 'Save & Start';
}

const greetings = ['hello', 'ciao', 'bonjour', 'hola', 'olá', 'willkommen', 'こんにちは', '안녕하세요', 'مرحبا', 'привет'];
let greetIdx = 0;
const greetingTextEl = document.getElementById('greeting-text');
const greetInterval = setInterval(() => {
  greetingTextEl.style.opacity = '0';
  setTimeout(() => {
    greetIdx = (greetIdx + 1) % greetings.length;
    greetingTextEl.textContent = greetings[greetIdx];
    greetingTextEl.style.opacity = '1';
  }, 550); // 550ms > 450ms transition — ensures full fade before text swaps
}, 2500);

// ── Language selector ─────────────────────────────────────────────────────────
const tickerInner = document.getElementById('lang-ticker-inner');
const tickerOffsets = { italian: 'translateY(0)', spanish: 'translateY(-1.2em)', french: 'translateY(-2.4em)' };

document.querySelectorAll('.lang-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedLanguage = btn.dataset.lang;
    tickerInner.style.animation = 'none';
    tickerInner.style.transform = tickerOffsets[selectedLanguage];
  });
});

document.getElementById('start-btn').addEventListener('click', async () => {
  const btn = document.getElementById('start-btn');
  const keyError = document.getElementById('key-error');
  keyError.classList.remove('show');

  if (!client) {
    const entered = document.getElementById('key-input').value.trim();
    if (!entered.startsWith('sk-')) { keyError.classList.add('show'); return; }
    localStorage.setItem('lv_key', entered);
    client = new Anthropic({ apiKey: entered, dangerouslyAllowBrowser: true });
  }

  btn.disabled = true;
  btn.textContent = 'Starting…';
  try {
    await Promise.all([startCamera(), loadVoices()]);
    clearInterval(greetInterval);
    welcomeScreenEl.style.display = 'none';
    mainEl.classList.add('show');
    flipBtn.classList.add('show');
  } catch {
    btn.disabled = false;
    btn.textContent = savedKey ? 'Start' : 'Save & Start';
    const existing = document.getElementById('welcome-err');
    if (!existing) {
      const errEl = document.createElement('p');
      errEl.id = 'welcome-err';
      errEl.style.cssText = 'color:#f87171;font-size:0.85rem;margin-top:0.25rem;';
      errEl.textContent = 'Could not access camera — please allow permissions and try again.';
      btn.after(errEl);
    }
  }
});

document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('start-btn').click();
});

flipBtn.addEventListener('click', () => flipCamera());
</script>
